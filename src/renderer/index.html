<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8"/>
    <title>Other Redis Desktop Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- 内容安全策略 (CSP) - 防止 XSS 攻击 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';">
    <style>
        html,
        body,
        #app {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        #initial-loading {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background: #151719;
            color: #f5f7fa;
        }

        .initial-loading-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 280px;
            padding: 32px;
        }

        .initial-loading-logo {
            width: 72px;
            height: 72px;
            margin-bottom: 22px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 16px;
            background: #1e88e5;
            box-shadow: 0 10px 28px rgba(30, 136, 229, 0.24);
        }

        .initial-loading-logo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .initial-loading-title {
            font: 600 18px/1.5 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .initial-loading-status {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 18px;
            color: rgba(245, 247, 250, 0.62);
            font: 13px/1.5 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }

        .initial-loading-spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(245, 247, 250, 0.2);
            border-top-color: #1e88e5;
            border-radius: 50%;
            animation: initial-loading-spin 0.85s linear infinite;
        }

        @keyframes initial-loading-spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
    <script type="module" src="/index.js"></script>
</head>
<body>
<div id="app">
    <div id="initial-loading" role="status" aria-live="polite">
        <div class="initial-loading-content">
            <div class="initial-loading-logo">
                <img src="./assets/logo.png" alt=""/>
            </div>
            <div class="initial-loading-title">Other Redis Desktop Manager</div>
            <div class="initial-loading-status">
                <span class="initial-loading-spinner" aria-hidden="true"></span>
                <span>Loading workspace...</span>
            </div>
        </div>
    </div>
</div>
<script>
    if (window.location.hash !== '#/main') {
        document.getElementById('initial-loading')?.remove()
    }
</script>
</body>
</html>
